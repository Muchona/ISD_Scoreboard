      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://www.citizenscore.ie/#app",
            "name": "CitizenScore.ie",
            "url": "https://www.citizenscore.ie/",
            "applicationCategory": "ReferenceApplication",
            "operatingSystem": "All",
            "inLanguage": "en-IE",
            "areaServed": {
              "@type": "Country",
              "name": "Ireland"
            },
            "description": "Self-service Irish naturalisation (Form 8) 150-point scorecard tracker, 1,825-day / 1,095-day reckonable residency calculator, and client-side PDF watermarker calibrated to Immigration Service Delivery (ISD) guidelines.",
            "offers": [
              {
                "@type": "Offer",
                "name": "Free Community Tier",
                "price": "0",
                "priceCurrency": "EUR"
              },
              {
                "@type": "Offer",
                "name": "CitizenScore Pro Vault",
                "price": "5.00",
                "priceCurrency": "EUR"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://www.citizenscore.ie/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How many points are required for Irish citizenship under the ISD Form 8 scorecard?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Applicants must reach 150 points for Identity Verification (proven once, e.g. a valid passport carries 150 points) and 150 points for each reckonable residency year made up of 1 Type A document (100 points, such as an Employment Detail Summary or P60) plus 1 Type B document (50 points, such as a utility bill or RTB tenancy letter)."
                }
              },
              {
                "@type": "Question",
                "name": "How many days of reckonable residence are required for Irish naturalisation?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Standard applicants need 1,825 reckonable days (5 years) within the preceding 9 years, including 365 continuous days immediately before the application date. Spouses or civil partners of Irish citizens need 1,095 reckonable days (3 years) within the preceding 5 years."
                }
              },
              {
                "@type": "Question",
                "name": "What is the Section 15C final-year absence rule for Irish citizenship?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Under Section 15C of the Irish Nationality and Citizenship Act, applicants are permitted up to 70 days of absence from Ireland in the final 12 months immediately preceding the application date (with up to 30 additional days allowed only in exceptional circumstances, up to 100 days maximum)."
                }
              }
            ]
          }
        ]
      }
    </script>

    <script>
      // Default to dark mode straight away for all new visitors.
      // Only switch to light if the user explicitly chose light mode previously.
      (function () {
        try {
          var t = localStorage.getItem('isd_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
